spring.application.name=centro-emmanuel
spring.datasource.url=jdbc:mysql://localhost:3307/centro_emmanuel
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port = 8080

# Se ejecuta el primer día de cada mes a las 08:00, hora de Buenos Aires.
reportes.mensuales.cron=${REPORTES_MENSUALES_CRON:0 0 8 1 * *}
reportes.mensuales.zona-horaria=${REPORTES_TIME_ZONE:America/Argentina/Buenos_Aires}
reportes.mensuales.directorio=${REPORTES_MENSUALES_DIR:./data/reportes-mensuales}
