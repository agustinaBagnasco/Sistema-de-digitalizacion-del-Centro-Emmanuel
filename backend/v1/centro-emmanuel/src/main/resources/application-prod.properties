spring.application.name=centro-emmanuel

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

server.port=${PORT:8080}

reportes.mensuales.cron=${REPORTES_MENSUALES_CRON:0 0 8 1 * *}
reportes.mensuales.zona-horaria=${REPORTES_TIME_ZONE:America/Montevideo}
reportes.mensuales.directorio=${REPORTES_MENSUALES_DIR:./data/reportes-mensuales}